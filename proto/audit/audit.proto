syntax = "proto3";

package fixture.audit;

import "proto/common/common.proto";

option go_package = "github.com/xytan0056/bazel-fixture/proto/audit";

message Event {
  string actor = 1;
  string action = 2;
  int64 at_unix_ms = 3;
  fixture.common.Status status = 4;
}

message ListEventsRequest {
  fixture.common.Pagination page = 1;
  string actor_filter = 2;
}

message ListEventsResponse {
  repeated Event events = 1;
  string next_cursor = 2;
}
